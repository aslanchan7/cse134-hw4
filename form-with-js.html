<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Aslan Chan | Portfolio</title>
        <link rel="icon" href="favicon.ico" />
        <link rel="stylesheet" href="main.css" />
        <link rel="stylesheet" href="form.css" />
        <script src="form.js" defer></script>
    </head>

    <body>
        <header>
            <a href="/">Back</a>
        </header>

        <main>
            <form id="contact-form" method="post" action="https://httpbin.org/post" >
                <label-input-container>
                    <label for="name-field">Name</label>
                    <input id="name-field" type="text" name="name" autocomplete="name" placeholder="Your Name" minlength="1" maxlength="100" required="required" />
                    <span id="name-field-error">&lpar;required&rpar;</span>
                </label-input-container>

                <label-input-container>                    
                    <label for="email-field">Email</label>
                    <input id="email-field" type="email" name="email" autocomplete="email" placeholder="Your Email" required="required" />
                    <span id="email-field-error">&lpar;required, ensure valid email format&rpar;</span>
                </label-input-container>
                
                <label-input-container>
                    <label for="message-field">Message</label>
                    <textarea id="message-field" name="message" placeholder="Write a message" minlength="10" maxlength="1000" required="required"></textarea>
                    <span id="message-field-error">&lpar;required, character count must be between 10 and 1000&rpar;</span>
                </label-input-container>
                
                <input hidden="hidden" name="possible_bot" value="true" />
                <input id="form-errors" hidden="hidden" name="form-errors" value="" disabled />

                <button type="submit" id="submit-button">Send Message</button>
            </form>
        </main>
    </body>
</html>
